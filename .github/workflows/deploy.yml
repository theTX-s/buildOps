name: Build and Deploy Application

on:
  push:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: [self-hosted, virtualbox]
    timeout-minutes: 15

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0'

    - name: Publish .NET Backend
      run: |
        dotnet restore backend/
        dotnet publish backend/ -c Release -o ./backend-dist

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Build React Frontend
      run: |
        cd frontend
        npm ci 
        npm run build

    - name: Deploy Assets Safely
      run: |
        rsync -rlptD --delete ./backend-dist/ /var/www/builOps/backend/
        rsync -rlptD --delete ./frontend/dist/ /var/www/buildOps/frontend/

    - name: Restart Systemd API Service
      run: |
        sudo systemctl restart webapi.service

    - name: Verify Service Status
      run: |
        sleep 3
        systemctl is-active webapi.service
